<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ReserveHub | イベント予約・受付管理</title>
  <meta name="description" content="イベントの空き状況確認・予約・主催者の受付管理ができる予約システムです。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Noto Sans JP"', 'Hiragino Kaku Gothic ProN', 'Meiryo', 'system-ui', 'sans-serif'] },
        },
      },
    };
  </script>
  <style type="text/tailwindcss">
    @layer components {
      .btn { @apply inline-flex items-center justify-center gap-1.5 rounded-lg px-3.5 py-2 text-sm font-bold transition-colors whitespace-nowrap disabled:opacity-50 disabled:cursor-not-allowed focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2; }
      .btn-primary { @apply btn bg-indigo-600 text-white hover:bg-indigo-700; }
      .btn-ai { @apply btn bg-violet-600 text-white hover:bg-violet-700; }
      .btn-dark { @apply btn bg-slate-800 text-white hover:bg-slate-900; }
      .btn-secondary { @apply btn bg-white text-slate-700 border border-slate-300 hover:bg-slate-50; }
      .btn-danger { @apply btn bg-rose-600 text-white hover:bg-rose-700; }
      .btn-ghost { @apply btn bg-transparent text-slate-600 hover:bg-slate-100; }
      .btn-sm { @apply px-2.5 py-1.5 text-xs; }
      .btn-icon { @apply inline-flex items-center justify-center w-8 h-8 rounded-lg border border-slate-300 bg-white text-slate-600 hover:bg-slate-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500; }
      .input { @apply w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-800 placeholder:text-slate-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none disabled:bg-slate-100; }
      .label { @apply block text-xs font-bold text-slate-600 mb-1; }
      .card { @apply bg-white rounded-2xl border border-slate-200; }
      .pill { @apply inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-[11px] font-bold; }
      .seg { @apply inline-flex rounded-lg border border-slate-200 bg-slate-50 p-0.5; }
      .seg-btn { @apply inline-flex items-center gap-1 rounded-md px-2.5 py-1.5 text-xs font-bold text-slate-500 hover:text-slate-800; }
      .seg-btn.is-active { @apply bg-white text-indigo-700 shadow-sm; }
    }
  </style>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .modal-panel { animation: modalIn .18s ease-out; }
    @keyframes modalIn { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
    .typing span { display:inline-block; width:6px; height:6px; margin:0 2px; border-radius:50%; background:#a5b4fc; animation: blink 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%,80%,100% { opacity:.3 } 40% { opacity:1 } }
    @media (prefers-reduced-motion: reduce) { .modal-panel, .typing span { animation: none; } }
    #loading-bar { transition: opacity .2s; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen">
  <div id="loading-bar" class="fixed top-0 left-0 right-0 h-1 z-[90] opacity-0 pointer-events-none">
    <div class="h-full w-1/3 bg-indigo-500 animate-pulse"></div>
  </div>

  <header id="app-header" class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200"></header>

  <main id="app-main" class="max-w-6xl mx-auto px-4 py-6 pb-28"></main>

  <button id="chat-fab" data-act="chat-open" aria-label="AIイベントコンシェルジュを開く"
    class="fixed right-4 bottom-4 z-40 inline-flex items-center gap-2 rounded-full bg-indigo-600 text-white pl-4 pr-5 py-3 shadow-lg hover:bg-indigo-700 focus:outline-none focus-visible:ring-4 focus-visible:ring-indigo-300">
    <i data-lucide="bot" class="w-5 h-5"></i><span class="text-sm font-bold">AIに空きを聞く</span>
  </button>

  <section id="chat-panel" class="hidden fixed z-40 inset-x-0 bottom-0 sm:inset-x-auto sm:right-4 sm:bottom-4 sm:w-[400px] h-[75vh] sm:h-[600px] bg-white sm:rounded-2xl rounded-t-2xl border border-slate-200 shadow-2xl flex flex-col" aria-label="AIイベントコンシェルジュ"></section>

  <div id="modal-root"></div>
  <div id="toast-root" class="fixed top-16 left-1/2 -translate-x-1/2 z-[85] w-[92vw] max-w-sm space-y-2 pointer-events-none"></div>

  <noscript><p class="p-6 text-center">このサイトを利用するにはJavaScriptを有効にしてください。</p></noscript>
  <script>
    // キャッシュ対策：config.js と app.js を毎回最新で読み込む（index.html の更新を待たずに反映される）
    (function () {
      var t = Date.now();
      function load(src, cb) {
        var s = document.createElement('script');
        s.src = src + '?t=' + t;
        s.onload = cb || null;
        s.onerror = function () { document.body.insertAdjacentHTML('beforeend', '<p style="padding:16px;color:#e11d48">' + src + ' を読み込めませんでした。再読み込みしてください。</p>'); };
        document.body.appendChild(s);
      }
      load('config.js', function () { load('app.js'); });
    })();
  </script>
</body>
</html>
